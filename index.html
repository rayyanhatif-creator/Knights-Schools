<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>The Black Box | نظام التشفير السري</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff41; /* لون الهكرز الكلاسيكي أو خله #d4af37 للذهبي */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .terminal {
            width: 80%;
            max-width: 600px;
            background: #000;
            border: 1px solid #333;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            border-radius: 5px;
            position: relative;
        }

        .terminal::before {
            content: "AL-EZZ SECURITY SYSTEM v2.0";
            position: absolute;
            top: -25px;
            left: 10px;
            font-size: 0.8rem;
            color: #444;
        }

        h2 { text-align: center; letter-spacing: 5px; text-transform: uppercase; }

        textarea {
            width: 100%;
            height: 100px;
            background: #0a0a0a;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 10px;
            box-sizing: border-box;
            margin: 10px 0;
            outline: none;
            resize: none;
        }

        .controls { display: flex; gap: 10px; }

        button {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #00ff41;
            color: #000;
        }

        #output {
            margin-top: 20px;
            padding: 10px;
            border: 1px dashed #444;
            min-height: 50px;
            word-break: break-all;
            font-size: 0.9rem;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: #00ff41;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<div class="terminal">
    <h2>SYSTEM LOCKED</h2>
    <p>> أدخل رسالتك السرية أدناه:</p>
    <textarea id="message" placeholder="اكتب هنا..."></textarea>
    
    <div class="controls">
        <button onclick="encrypt()">تشفير (ENCRYPT)</button>
        <button onclick="decrypt()">فك التشفير (DECRYPT)</button>
    </div>

    <div id="output">جاري انتظار الأوامر...<span class="cursor"></span></div>
    
    <p style="font-size: 0.7rem; color: #333; margin-top: 20px; text-align: center;">
        حقوق الوصول محفوظة لأسرة العز © 2026
    </p>
</div>

<script>
    // وظيفة التشفير بسيطة لكن شكلها معقد (Base64)
    function encrypt() {
        let msg = document.getElementById('message').value;
        if(!msg) return;
        
        document.getElementById('output').innerText = "جاري التشفير...";
        
        setTimeout(() => {
            let encoded = btoa(unescape(encodeURIComponent(msg)));
            document.getElementById('output').innerText = "الرمز السري: " + encoded;
        }, 800);
    }

    function decrypt() {
        let msg = document.getElementById('message').value;
        if(!msg) return;

        document.getElementById('output').innerText = "جاري فك التشفير...";

        setTimeout(() => {
            try {
                let decoded = decodeURIComponent(escape(atob(msg)));
                document.getElementById('output').innerText = "الرسالة الأصلية: " + decoded;
            } catch(e) {
                document.getElementById('output').innerText = "خطأ: الرمز غير صحيح!";
            }
        }, 800);
    }
</script>

</body>
</html>
