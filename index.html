<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بنك أسرة العز المعرفي</title>
    <style>
        :root {
            --gold: #c5a059;
            --black: #0a0a0a;
            --gray: #1a1a1a;
            --white: #ffffff;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--gold);
            margin-bottom: 30px;
        }

        h1 { color: var(--gold); font-weight: 300; margin: 0; letter-spacing: 2px; }
        p.subtitle { color: #888; font-size: 0.9rem; margin-top: 10px; }

        .search-box {
            margin-bottom: 30px;
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            background: var(--gray);
            border: 1px solid #333;
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus { border-color: var(--gold); }

        .btn-add {
            background: var(--gold);
            color: var(--black);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn-add:hover { opacity: 0.9; transform: translateY(-2px); }

        .question-card {
            background: var(--gray);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-right: 4px solid var(--gold);
            animation: fadeIn 0.5s ease;
        }

        .question-text { font-size: 1.1rem; margin-bottom: 10px; display: block; }
        .answer-text { color: var(--gold); font-size: 0.95rem; display: block; }
        
        .tag {
            font-size: 0.7rem;
            background: #333;
            padding: 4px 10px;
            border-radius: 20px;
            color: #aaa;
            margin-top: 10px;
            display: inline-block;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        footer { text-align: center; margin-top: 50px; color: #444; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>بنك أسرة العز المعرفي</h1>
        <p class="subtitle">منصة تبادل الأسئلة والخبرات بين الطلاب</p>
    </header>

    <!-- إضافة سؤال جديد -->
    <div class="search-box">
        <input type="text" id="qInput" placeholder="اكتب السؤال هنا...">
        <textarea id="aInput" placeholder="اكتب الإجابة أو الملاحظة هنا..."></textarea>
        <button class="btn-add" onclick="addQuestion()">إضافة إلى البنك المعرفي</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #222; margin: 40px 0;">

    <!-- قائمة الأسئلة -->
    <div id="questionsList">
        <!-- أسئلة تجريبية -->
        <div class="question-card">
            <span class="question-text">ما هي عاصمة البرمجة الحديثة؟</span>
            <span class="answer-text">تعتبر لغة Python حالياً الأكثر شعبية للذكاء الاصطناعي.</span>
            <span class="tag">حاسب آلي</span>
        </div>
    </div>

    <footer>حقوق المنصة محفوظة لأسرة العز © 2026</footer>
</div>

<script>
    function addQuestion() {
        const q = document.getElementById('qInput').value;
        const a = document.getElementById('aInput').value;

        if (q === "" || a === "") {
            alert("يرجى ملء السؤال والإجابة لإفادة زملائك.");
            return;
        }

        const list = document.getElementById('questionsList');
        
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
            <span class="question-text">${q}</span>
            <span class="answer-text">${a}</span>
            <span class="tag">مضاف حديثاً</span>
        `;

        list.insertBefore(card, list.firstChild);

        // مسح الخانات بعد الإضافة
        document.getElementById('qInput').value = "";
        document.getElementById('aInput').value = "";
    }
</script>

</body>
</html>
