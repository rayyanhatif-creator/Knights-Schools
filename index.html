<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إكسبو 2026 | مصنع العز الرقمي</title>
    <style>
        :root {
            --gold: #c5a059;
            --black: #0a0a0a;
            --gray: #1a1a1a;
        }

        body {
            background-color: var(--black);
            color: white;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .expo-lab {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 90%;
            max-width: 1000px;
            background: var(--gray);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--gold);
        }

        .controls-panel { text-align: right; }
        
        .preview-panel {
            background: #000;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed var(--gold);
            position: relative;
            overflow: hidden;
        }

        h1 { color: var(--gold); font-size: 1.5rem; margin-bottom: 30px; }

        label { display: block; margin-bottom: 10px; color: #888; font-size: 0.9rem; }
        
        input, select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* شكل الميدالية في المعاينة */
        .keychain-preview {
            width: 200px;
            height: 100px;
            background: linear-gradient(145deg, #1a1a1a, #000);
            border: 3px solid var(--gold);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--gold);
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.2);
            transition: 0.3s;
        }

        .btn-print {
            background: var(--gold);
            color: black;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .status-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.7rem;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 2px 8px;
            border-radius: 10px;
        }

        footer { grid-column: span 2; font-size: 0.7rem; color: #444; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="expo-lab">
    <div class="controls-panel">
        <h1>معمل التصميم الرقمي</h1>
        <label>الاسم المحفور:</label>
        <input type="text" id="nameInput" placeholder="اكتب اسمك..." oninput="updatePreview()">
        
        <label>نوع المادة (Filament):</label>
        <select id="material" onchange="updatePreview()">
            <option value="gold">PLA - ذهبي ملكي</option>
            <option value="silver">PLA - فضي لامع</option>
            <option value="black">Carbon Fiber - أسود مطفي</option>
        </select>

        <label>السمك الهيكلي:</label>
        <input type="range" min="1" max="10" value="5" oninput="updatePreview()">

        <button class="btn-print" onclick="sendToPrint()">إرسال أمر التصنيع</button>
    </div>

    <div class="preview-panel">
        <div class="status-tag">معاينة ثلاثية الأبعاد</div>
        <div class="keychain-preview" id="keychain">الاسم</div>
        <p style="color: #444; font-size: 0.8rem; margin-top: 20px;">النموذج جاهز للتصدير بصيغة STL</p>
    </div>

    <footer>نظام إكسبو المدرسي - تطوير أسرة العز لتقنيات المستقبل</footer>
</div>

<script>
    function updatePreview() {
        const name = document.getElementById('nameInput').value;
        const material = document.getElementById('material').value;
        const keychain = document.getElementById('keychain');

        keychain.innerText = name || "الاسم";

        if(material === "gold") keychain.style.borderColor = "#c5a059";
        if(material === "silver") keychain.style.borderColor = "#c0c0c0";
        if(material === "black") keychain.style.borderColor = "#333";
    }

    function sendToPrint() {
        alert("تم توليد ملف الإحداثيات G-Code بنجاح. سيتم البدء في المعالجة البرمجية.");
    }
</script>

</body>
</html>
