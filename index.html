<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إكسبو المدرسة | مستشارك الذكي</title>
    <style>
        :root {
            --gold: #D4AF37;
            --black: #050505;
            --gray: #121212;
            --accent: #FFD700;
        }

        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .expo-container {
            width: 90%;
            max-width: 600px;
            background: var(--gray);
            padding: 40px;
            border-radius: 30px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            text-align: center;
            position: relative;
        }

        h1 { color: var(--gold); font-size: 2.2rem; margin-bottom: 10px; font-weight: 300; }
        .tagline { color: #888; margin-bottom: 30px; font-size: 0.9rem; }

        .question-box { margin: 20px 0; }
        
        select, input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 1rem;
            outline: none;
        }

        .btn-analyze {
            background: linear-gradient(45deg, var(--gold), #b8860b);
            color: black;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-analyze:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--gold); }

        /* شاشة التحليل */
        #loading-screen { display: none; }
        .radar {
            width: 100px; height: 100px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        #result-screen { display: none; animation: fadeIn 1s; }
        .result-title { color: var(--gold); font-size: 1.8rem; margin: 20px 0; }

        footer {
            margin-top: 30px;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 1px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="expo-container">
    <!-- شاشة البداية -->
    <div id="start-screen">
        <h1>EXPO 2026</h1>
        <p class="tagline">حلل مستقبلك المهني عبر خوارزميات العز الذكية</p>
        
        <div class="question-box">
            <input type="text" id="userName" placeholder="أدخل اسمك الكريم">
            <select id="interest">
                <option value="">ما هو مجال اهتمامك الأكبر؟</option>
                <option value="logic">المنطق والرياضيات</option>
                <option value="art">التصميم والفنون</option>
                <option value="business">التجارة والإدارة</option>
                <option value="science">العلوم والابتكار</option>
            </select>
        </div>
        <button class="btn-analyze" onclick="startAnalysis()">تحليل البيانات المهنية</button>
    </div>

    <!-- شاشة التحليل (للأكشن) -->
    <div id="loading-screen">
        <div class="radar"></div>
        <p id="loading-text">جاري مطابقة المهارات مع سوق العمل السعودي...</p>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen">
        <p>بناءً على تحليلاتنا يا <span id="resName" style="color:var(--gold)"></span>:</p>
        <div class="result-title" id="careerRes"></div>
        <p id="careerDesc" style="color:#aaa; font-size:0.9rem; line-height:1.6;"></p>
        <button class="btn-analyze" style="margin-top:20px; background:none; border:1px solid var(--gold); color:var(--gold);" onclick="location.reload()">تجربة زائر آخر</button>
    </div>

    <footer>مشروع معرض إكسبو - برمجة أسرة العز</footer>
</div>

<script>
    function startAnalysis() {
        const name = document.getElementById('userName').value;
        const interest = document.getElementById('interest').value;

        if(!name || !interest) {
            alert("فضلاً أدخل اسمك واختر مجال اهتمامك");
            return;
        }

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('loading-screen').style.display = 'block';

        let texts = ["فحص الميول الشخصية...", "تحليل احتياجات رؤية 2030...", "تحديد المسار الأمثل..."];
        let i = 0;
        let interval = setInterval(() => {
            document.getElementById('loading-text').innerText = texts[i];
            i++;
            if(i >= texts.length) {
                clearInterval(interval);
                showResult(name, interest);
            }
        }, 1200);
    }

    function showResult(name, interest) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('resName').innerText = name;

        const resTitle = document.getElementById('careerRes');
        const resDesc = document.getElementById('careerDesc');

        if(interest === "logic") {
            resTitle.innerText = "هندسة البرمجيات والذكاء الاصطناعي";
            resDesc.innerText = "لديك عقلية تحليلية فذة، هذا المسار سيجعلك من صناع التكنولوجيا القادمين.";
        } else if(interest === "art") {
            resTitle.innerText = "تصميم واجهات المستخدم (UI/UX)";
            resDesc.innerText = "إبداعك البصري هو مفتاح نجاح التطبيقات العالمية، مكانك في قلب التصميم الرقمي.";
        } else if(interest === "business") {
            resTitle.innerText = "تحليل البيانات ونظم المعلومات";
            resDesc.innerText = "القدرة على اتخاذ القرار هي موهبتك، ستكون القائد الذي يوجه الشركات تقنياً.";
        } else {
            resTitle.innerText = "الابتكار في التقنيات الحيوية";
            resDesc.innerText = "دمج العلم بالتقنية هو شغفك، مستقبلك في المختبرات الذكية ومراكز الأبحاث.";
        }
    }
</script>

</body>
</html>
