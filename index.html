<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة إكسبو الذكية | 2026</title>
    <style>
        :root { --gold: #D4AF37; --black: #050505; --dark-gray: #111; }
        
        * { box-sizing: border-box; }
        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. خلفية جزيئات متحركة خفيفة */
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: -1; }

        .wrapper { max-width: 600px; width: 90%; text-align: center; padding: 40px 0; }

        h1 { color: var(--gold); font-weight: 300; letter-spacing: 4px; margin-bottom: 5px; }
        .sub-head { color: #555; font-size: 0.8rem; margin-bottom: 40px; }

        /* 2. قسم الرادار (الخريطة التفاعلية) */
        .radar-box {
            position: relative;
            width: 300px; height: 300px;
            margin: 20px auto;
            border-radius: 50%;
            border: 1px solid #222;
            background: radial-gradient(circle, #0a0a0a 0%, #000 100%);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
        }

        .sweep {
            position: absolute; width: 50%; height: 50%; top: 0; left: 50%;
            background: linear-gradient(0deg, transparent, rgba(212, 175, 55, 0.2));
            border-left: 1px solid var(--gold);
            transform-origin: bottom left;
            animation: rotate 4s linear infinite;
        }

        .point {
            position: absolute; width: 10px; height: 10px;
            background: var(--gold); border-radius: 50%;
            cursor: pointer; box-shadow: 0 0 10px var(--gold);
            transition: 0.3s; z-index: 10;
        }
        .point:hover { transform: scale(1.5); background: white; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 3. كرت التسجيل والبصمة */
        .main-card {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #222;
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
        }

        input, select {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #000; border: 1px solid #333;
            color: white; border-radius: 8px; text-align: center;
        }

        .fingerprint-area {
            width: 70px; height: 70px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            margin: 20px auto;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

        /* 4. بطاقة الحضور النهائية */
        #badge-result {
            display: none;
            background: linear-gradient(135deg, #111, #000);
            border: 1px solid var(--gold);
            padding: 40px; border-radius: 15px; margin-top: 20px;
            position: relative; overflow: hidden;
        }

        footer { margin-top: 60px; font-size: 0.7rem; color: #333; letter-spacing: 3px; }
    </style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<div class="wrapper">
    <header>
        <h1>EXPO 2026</h1>
        <p class="sub-head">نظام الرصد والدخول الذكي</p>
    </header>

    <!-- الرادار -->
    <div class="radar-box">
        <div class="sweep"></div>
        <!-- نقاط الأركان -->
        <div class="point" style="top:30%; left:20%;" title="ركن البرمجة" onclick="alert('ركن البرمجة: ممر A - طاولة 1')"></div>
        <div class="point" style="top:70%; left:60%;" title="ركن الفنون" onclick="alert('ركن الفنون: ممر B - طاولة 4')"></div>
        <div class="point" style="top:40%; left:80%;" title="المسرح" onclick="alert('المسرح: وسط القاعة')"></div>
    </div>

    <!-- كرت التسجيل -->
    <div class="main-card" id="reg-form">
        <input type="text" id="userName" placeholder="اسم الزائر الكريم">
        <select id="userVote">
            <option value="">صوت لأفضل ركن</option>
            <option value="البرمجة">ركن البرمجة</option>
            <option value="العلوم">ركن العلوم</option>
        </select>
        <p style="font-size: 0.7rem; color: #666;">المس البصمة لتأكيد الحضور</p>
        <div class="fingerprint-area" onclick="startScan()">
            <svg width="35" height="35" viewBox="0 0 24 24" fill="var(--gold)">
                <path d="M12,1C8.14,1,5,4.14,5,8v3.5c0,0.28,0.22,0.5,0.5,0.5s0.5-0.22,0.5-0.5V8c0-3.31,2.69-6,6-6s6,2.69,6,6v10c0,1.1-0.9,2-2,2s-2-0.9-2-2V9c0-1.1-0.9-2-2-2s-2,0.9-2,2v7.5c0,0.28,0.22,0.5,0.5,0.5s0.5-0.22,0.5-0.5V9c0-0.55,0.45-1,1-1s1,0.45,1,1v9c0,1.65,1.35,3,3,3s3-1.35,3-3V8C19,4.14,15.86,1,12,1z"/>
            </svg>
        </div>
    </div>

    <!-- البطاقة -->
    <div id="badge-result">
        <h3 style="color: var(--gold); margin: 0;">بطاقة دخول معتمدة</h3>
        <h2 id="finalName" style="margin: 15px 0; font-size: 2rem; font-weight: 300;"></h2>
        <p style="font-size: 0.8rem; color: #444;">ID: <span id="idNum"></span> | EXPO 2026</p>
    </div>

    <footer>AL-EZZ SYSTEMS // FUTURE GATE</footer>
</div>

<script>
    // 1. نظام الخلفية (النجوم)
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = [];
        for(let i=0; i<80; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5});
    }
    function draw() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "#D4AF37";
        stars.forEach(s => {
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
            s.y += 0.2; if(s.y > canvas.height) s.y = 0;
        });
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize', init);
    init(); draw();

    // 2. منطق المسح وإصدار البطاقة
    function startScan() {
        const name = document.getElementById('userName').value;
        const vote = document.getElementById('userVote').value;
        if(!name || !vote) { alert("أدخل بياناتك أولاً يا بطل"); return; }

        // محاكاة المسح
        document.querySelector('.fingerprint-area').style.animation = "none";
        document.querySelector('.fingerprint-area').style.background = "var(--gold)";
        
        setTimeout(() => {
            document.getElementById('reg-form').style.display = 'none';
            const badge = document.getElementById('badge-result');
            badge.style.display = 'block';
            document.getElementById('finalName').innerText = name;
            document.getElementById('idNum').innerText = Math.floor(Math.random()*9000) + 1000;
        }, 1500);
    }
</script>

</body>
</html>
