<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إكسبو 2026 | نظام الإدارة الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --black: #050505;
            --gray: #121212;
        }

        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .panel {
            background: var(--gray);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1, h2 { color: var(--gold); font-weight: 300; }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
        }

        .btn-gold {
            background: var(--gold);
            color: black;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-gold:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--gold); }

        .stat-box {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #222;
        }

        .stat-number {
            font-size: 3rem;
            color: var(--gold);
            display: block;
        }

        footer {
            grid-column: span 2;
            text-align: center;
            margin-top: 30px;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- لوحة التحكم والتسجيل -->
    <div class="panel">
        <h2>تسجيل الزوار</h2>
        <p style="color: #666; font-size: 0.8rem;">سجل حضورك وصوت للأفضل</p>
        <input type="text" id="voterName" placeholder="اسم الزائر">
        <select id="voteChoice">
            <option value="">صوّت لأفضل ركن</option>
            <option value="0">ركن البرمجة</option>
            <option value="1">ركن الفنون</option>
            <option value="2">ركن العلوم</option>
            <option value="3">ركن الريادة</option>
        </select>
        <button class="btn-gold" onclick="submitVote()">تأكيد الحضور والتصويت</button>
        
        <div class="stat-box">
            <span class="stat-number" id="visitorCount">0</span>
            <span>إجمالي الزوار</span>
        </div>
    </div>

    <!-- لوحة النتائج الحية -->
    <div class="panel">
        <h2>نتائج إكسبو الحية (Live)</h2>
        <canvas id="votesChart"></canvas>
    </div>

    <footer>نظام إدارة إكسبو - تطوير أسرة العز لتقنيات المستقبل</footer>
</div>

<script>
    let visitorCount = 0;
    let votesData = [5, 2, 3, 1]; // بيانات وهمية للبداية

    // إعداد الرسم البياني
    const ctx = document.getElementById('votesChart').getContext('2d');
    const votesChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['البرمجة', 'الفنون', 'العلوم', 'الريادة'],
            datasets: [{
                label: 'عدد الأصوات',
                data: votesData,
                backgroundColor: '#c5a059',
                borderColor: '#D4AF37',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true, grid: { color: '#222' } },
                x: { grid: { display: false } }
            },
            plugins: {
                legend: { labels: { color: 'white' } }
            }
        }
    });

    function submitVote() {
        const name = document.getElementById('voterName').value;
        const choice = document.getElementById('voteChoice').value;

        if(!name || choice === "") {
            alert("فضلاً أدخل اسمك واختر ركنك المفضل");
            return;
        }

        // تحديث البيانات
        visitorCount++;
        document.getElementById('visitorCount').innerText = visitorCount;
        votesData[choice]++;
        votesChart.update();

        // إعادة ضبط الخانات
        document.getElementById('voterName').value = "";
        document.getElementById('voteChoice').value = "";
        
        alert("شكراً لزيارتك يا " + name + "، تم تسجيل صوتك بنجاح!");
    }
</script>

</body>
</html>
