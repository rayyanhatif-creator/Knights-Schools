<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إكسبو 2026 | النسخة الاحترافية</title>
    <style>
        :root { --gold: #D4AF37; --bg: #050505; --card: #0d0d0d; --glow: rgba(212, 175, 55, 0.5); }
        
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { background-color: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }

        .container { max-width: 600px; margin: auto; padding: 20px; }

        /* 1. قسم الشرح - حركة دخول فخمة */
        .hero-section {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
        }

        .gold-title {
            font-size: 3.2rem; color: var(--gold);
            text-shadow: 0 0 30px var(--glow);
            margin-bottom: 10px; letter-spacing: 8px;
            animation: zoomIn 1.5s ease;
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        /* 2. قسم تصريح الدخول */
        .input-group {
            background: var(--card); padding: 40px; border-radius: 30px;
            border: 1px solid #222; box-shadow: 0 0 40px rgba(0,0,0,1);
            margin-bottom: 50px;
        }

        input {
            width: 100%; padding: 18px; margin: 15px 0;
            background: #000; border: 1px solid #333;
            color: var(--gold); border-radius: 15px; text-align: center;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--glow); }

        .btn-action {
            background: linear-gradient(45deg, #b8860b, var(--gold));
            color: #000; padding: 18px; border: none; border-radius: 15px;
            font-weight: bold; cursor: pointer; width: 100%; font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        /* 3. الرادار العسكري (بديل الخريطة القديمة) */
        .radar-box {
            position: relative; width: 300px; height: 300px;
            margin: 40px auto; border-radius: 50%;
            border: 2px solid #111; background: #000;
            overflow: hidden; box-shadow: 0 0 50px rgba(212, 175, 55, 0.1);
        }

        .radar-sweep {
            position: absolute; width: 50%; height: 50%; top: 0; left: 50%;
            background: linear-gradient(0deg, transparent, var(--glow));
            border-left: 2px solid var(--gold);
            transform-origin: bottom left; animation: rotate 3s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .location-node {
            position: absolute; width: 12px; height: 12px;
            background: var(--gold); border-radius: 50%;
            box-shadow: 0 0 20px var(--gold); z-index: 5;
            animation: pulse-node 2s infinite;
        }

        @keyframes pulse-node { 0% { transform: scale(1); } 50% { transform: scale(1.5); opacity: 0.7; } 100% { transform: scale(1); } }

        /* البطاقة النهائية */
        #final-pass {
            display: none; border: 1px solid var(--gold);
            padding: 40px; border-radius: 20px; background: #080808;
            margin-top: 20px; text-align: center;
        }

        .blinking { animation: blink 2s infinite; color: var(--gold); }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="container">
    
    <section class="hero-section">
        <h1 class="gold-title">EXPO 2026</h1>
        <p style="color: #666; max-width: 400px; line-height: 1.6;">
            مستقبل الابتكار يبدأ من هنا. منصة رقمية متكاملة لاستكشاف أركان المعرض وإدارة الحضور بذكاء.
        </p>
        <p class="blinking" style="margin-top: 30px;">اسحب للأعلى للبدء ↓</p>
    </section>

    <section id="auth-section" style="padding: 100px 0;">
        <div class="input-group" id="reg-form">
            <h2 style="color: var(--gold); font-weight: 300;">سجل حضورك الآن</h2>
            <input type="text" id="nameInput" placeholder="أدخل اسمك الكريم">
            <button class="btn-action" onclick="issuePass()">إصدار التصريح الرقمي</button>
        </div>

        <div id="final-pass">
            <div style="font-size: 0.7rem; letter-spacing: 5px; color: var(--gold);">SECURE PASS</div>
            <h2 id="displayName" style="font-size: 2.2rem; margin: 15px 0;"></h2>
            <div style="border-top: 1px solid #222; padding-top: 15px; font-family: monospace;">
                #<span id="passId"></span> | APPROVED
            </div>
        </div>
    </section>

    <section style="padding: 50px 0; text-align: center;">
        <h2 style="color: var(--gold); font-weight: 300;">رادار المواقع</h2>
        <div class="radar-box">
            <div class="radar-sweep"></div>
            <div class="location-node" style="top:20%; left:30%;" onclick="alert('ركن البرمجة')"></div>
            <div class="location-node" style="top:60%; left:70%;" onclick="alert('ركن الذكاء الاصطناعي')"></div>
            <div class="location-node" style="top:40%; left:15%;" onclick="alert('المسرح الرئيسي')"></div>
        </div>
        <p style="color: #444; font-size: 0.8rem;">نظام التموضع العالمي مفعل..</p>
    </section>

</div>

<script>
    function issuePass() {
        const name = document.getElementById('nameInput').value;
        if(!name) { alert("اكتب اسمك يا بطل"); return; }

        document.getElementById('reg-form').style.display = 'none';
        const pass = document.getElementById('final-pass');
        pass.style.display = 'block';
        document.getElementById('displayName').innerText = name;
        document.getElementById('passId').innerText = Math.floor(Math.random()*90000 + 10000);
        
        // حركة نزول تلقائي للرادار
        setTimeout(() => {
            window.scrollBy(0, 500);
        }, 1500);
    }
</script>

</body>
</html>
