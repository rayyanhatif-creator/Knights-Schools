<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العز الرقمية | إكسبو 2026</title>
    <style>
        :root { --gold: #D4AF37; --black: #050505; --accent: #1a1a1a; }
        * { box-sizing: border-box; }
        
        body {
            background-color: var(--black);
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* خلفية شبكية فخمة */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(to right, #111 1px, transparent 1px),
                              linear-gradient(to bottom, #111 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .main-container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .logo-title {
            font-size: 2.5rem;
            color: var(--gold);
            letter-spacing: 6px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .tagline {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* نظام الرادار المطور */
        .scanner-unit {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 40px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            background: radial-gradient(circle, #080808 0%, #000 100%);
        }

        .scan-line {
            position: absolute;
            width: 50%;
            height: 2px;
            top: 50%;
            left: 50%;
            background: linear-gradient(to right, transparent, var(--gold));
            transform-origin: left;
            animation: rotateScan 3s linear infinite;
        }

        @keyframes rotateScan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .nav-point {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px var(--gold);
        }

        /* النموذج */
        .form-unit {
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #222;
            padding: 30px;
            border-radius: 15px;
        }

        input, select {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            outline: none;
        }

        input:focus { border-color: var(--gold); }

        .action-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            border-radius: 5px;
        }

        /* بطاقة التصريح */
        #pass-card {
            display: none;
            border: 1px solid var(--gold);
            padding: 40px;
            background: #0a0a0a;
            border-radius: 10px;
            position: relative;
        }

        footer {
            margin-top: 50px;
            color: #222;
            font-size: 0.7rem;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>

<div class="grid-bg"></div>

<div class="main-container">
    <div class="logo-title">EXPO 2026</div>
    <div class="tagline">FUTURE INNOVATION GATEWAY</div>

    <!-- نظام الرصد -->
    <div class="scanner-unit">
        <div class="scan-line"></div>
        <!-- نقاط الأركان -->
        <div class="nav-point" style="top:25%; left:35%;" onclick="alert('منطقة الابتكار البرمجي')"></div>
        <div class="nav-point" style="top:65%; left:75%;" onclick="alert('مختبر الذكاء الاصطناعي')"></div>
        <div class="nav-point" style="top:50%; left:20%;" onclick="alert('مركز العروض التقنية')"></div>
    </div>

    <!-- مدخلات الزائر -->
    <div class="form-unit" id="input-area">
        <input type="text" id="visitor" placeholder="اسم الزائر المعتمد">
        <select id="vote">
            <option value="">تأكيد التصويت للركن الأفضل</option>
            <option value="1">ركن البرمجيات</option>
            <option value="2">ركن الهندسة</option>
        </select>
        <button class="action-btn" onclick="verify()">توليد تصريح الدخول</button>
    </div>

    <!-- التصريح النهائي -->
    <div id="pass-card">
        <div style="color: var(--gold); font-size: 0.8rem; margin-bottom: 20px;">ACCESS GRANTED</div>
        <h2 id="final-name" style="margin: 0; font-weight: 300; font-size: 2rem;"></h2>
        <p style="color: #444; margin-top: 20px;">AL-EZZ SYSTEMS // VALID 2026</p>
    </div>

    <footer>حقوق الطبع محفوظة لأسرة العز</footer>
</div>

<script>
    function verify() {
        const name = document.getElementById('visitor').value;
        const vote = document.getElementById('vote').value;

        if(name && vote) {
            document.getElementById('input-area').style.display = 'none';
            document.getElementById('pass-card').style.display = 'block';
            document.getElementById('final-name').innerText = name;
        } else {
            alert("يرجى إكمال بيانات الاعتماد");
        }
    }
</script>

</body>
</html>
