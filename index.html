<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العز الذكية | EXPO 2026</title>
    <style>
        :root {
            --gold: #D4AF37;
            --black: #050505;
            --gray: #111;
        }

        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* خلفية النجوم المتحركة */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: -1;
        }

        .main-content {
            max-width: 800px;
            margin: auto;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 3rem;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            margin-bottom: 10px;
            font-weight: 300;
        }

        .card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--gold);
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 40px;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        /* الخريطة النبضية */
        .map-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .room {
            background: #1a1a1a;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .room:hover { border-color: var(--gold); background: #222; }

        /* مدخل البيانات والزر الفخم */
        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #333;
            color: white;
            border-radius: 12px;
            outline: none;
        }

        .btn-prime {
            background: linear-gradient(45deg, #D4AF37, #8A6D3B);
            color: black;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        /* تأثير المسح الرقمي */
        #scanner {
            display: none;
            margin: 20px 0;
            height: 4px;
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold);
            animation: scanLine 1.5s infinite;
        }

        @keyframes scanLine {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(50px); opacity: 0; }
        }

        /* بطاقة الزوار */
        #badge {
            display: none;
            border: 2px solid var(--gold);
            padding: 40px;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'), #111;
            border-radius: 20px;
            position: relative;
            animation: badgeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes badgeIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        footer { color: #444; font-size: 0.8rem; margin-top: 50px; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="main-content">
    <header>
        <h1>EXPO 2026</h1>
        <p style="color: #888;">مرحباً بك في مستقبل التكنولوجيا المدرسية</p>
    </header>

    <!-- تسجيل الحضور -->
    <div class="card" id="form-container">
        <h2>تسجيل الحضور الرقمي</h2>
        <input type="text" id="visitorName" placeholder="أدخل اسمك الكريم">
        <select id="vote">
            <option value="">صوت لأفضل ركن</option>
            <option value="ركن البرمجة">ركن البرمجة (ركننا)</option>
            <option value="ركن الفضاء">ركن الفضاء</option>
            <option value="ركن الكيمياء">ركن الكيمياء</option>
        </select>
        <button class="btn-prime" onclick="processEntry()">إصدار تصريح الدخول</button>
        <div id="scanner"></div>
    </div>

    <!-- بطاقة الدخول -->
    <div id="badge">
        <div style="font-size: 0.8rem; color: var(--gold);">تصريح دخول رسمي</div>
        <h2 id="finalName" style="margin: 10px 0; font-size: 2rem;"></h2>
        <div style="border-top: 1px solid #333; padding-top: 10px; font-size: 0.9rem;">
            زائر إكسبو المعتمد | رقم الحماية: #<span id="randomId"></span>
        </div>
        <p style="font-size: 0.7rem; margin-top: 20px; color: #666;">قم بتصوير الشاشة للاحتفاظ بالبطاقة</p>
    </div>

    <!-- الخريطة التفاعلية -->
    <div class="card">
        <h2>خريطة الأركان</h2>
        <div class="map-grid">
            <div class="room" onclick="alert('ركن البرمجة: يقع في المسار الذهبي - يسار')">ركن البرمجة</div>
            <div class="room" onclick="alert('ركن الفنون: يقع في نهاية الصالة')">ركن الفنون</div>
            <div class="room" onclick="alert('المسرح الرئيسي: يقع في المنتصف')">المسرح</div>
            <div class="room" onclick="alert('الاستراحة: تقع خلف الدرج')">منطقة الراحة</div>
        </div>
    </div>

    <footer>نظام إدارة الإكسبو - تطوير أسرة العز لتقنيات المستقبل</footer>
</div>

<script>
    // 1. نظام النجوم المتحركة
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = '#D4AF37';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function createParticles() {
        for (let i = 0; i < 100; i++) particles.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas(); createParticles(); animate();

    // 2. نظام معالجة الدخول
    function processEntry() {
        const name = document.getElementById('visitorName').value;
        const vote = document.getElementById('vote').value;

        if(!name || !vote) {
            alert("يرجى إكمال البيانات أولاً");
            return;
        }

        document.getElementById('scanner').style.display = 'block';
        
        setTimeout(() => {
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('badge').style.display = 'block';
            document.getElementById('finalName').innerText = name;
            document.getElementById('randomId').innerText = Math.floor(1000 + Math.random() * 9000);
        }, 2000);
    }
</script>

</body>
</html>
